# Actualización diaria de las fuentes y publicación de la instantánea para la app.
# Requiere: repositorio en GitHub con GitHub Pages activado (origen: GitHub Actions).
name: Actualizar guardias

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC = 06:17 (verano) / 05:17 (invierno) en Madrid
    # Zaragoza solo publica la guardia en curso, que cambia a las 9:15: segunda pasada después.
    - cron: "47 8 * * *"   # 08:47 UTC = 10:47 (verano) / 09:47 (invierno) en Madrid
  workflow_dispatch:

permissions: {}

concurrency:
  group: actualizar-guardias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Checkout y commit de los datos, solo tras superar los tests.
    env:
      FLUTTER_VERSION: "3.47.8"
      FLUTTER_SHA256: "baf7dcc5a3dbba60fe863bf493a6cf203195621f7786eaa5a1bba02cd0d87dd2"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DASH__SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pip install -r backend/requirements.txt
      - name: Descargar, procesar, geocodificar y exportar
        run: python scripts/actualizar_todo.py
      - name: Tests
        run: |
          python -m unittest discover -s tests
          python -m pytest backend/tests -q
      - name: Caché del paquete oficial de Flutter
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/flutter_linux_3.47.8-stable.tar.xz
          key: flutter-${{ runner.os }}-x64-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}
      - name: Instalar Flutter con SHA-256 verificado
        env:
          FLUTTER_ARCHIVE: ${{ runner.temp }}/flutter_linux_3.47.8-stable.tar.xz
          FLUTTER_SDK_DIR: ${{ runner.tool_cache }}/flutter-3.47.8
        shell: bash
        run: |
          if [[ ! -f "$FLUTTER_ARCHIVE" ]]; then
            curl --fail --location --retry 2 \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
              --output "$FLUTTER_ARCHIVE"
          fi
          printf '%s  %s\n' "$FLUTTER_SHA256" "$FLUTTER_ARCHIVE" | sha256sum --check --strict -
          mkdir -p "$FLUTTER_SDK_DIR"
          tar -xJf "$FLUTTER_ARCHIVE" -C "$FLUTTER_SDK_DIR" --strip-components=1
          echo "$FLUTTER_SDK_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_SDK_DIR/bin/flutter" --version
      - name: Validar la app y la paridad con la API
        working-directory: app
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Guardar cambios (datos brutos, salidas y coordenadas)
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/out data/geo app/assets/snapshot.json app/test/fixtures/paridad_api.json
          git diff --cached --quiet || git commit -m "Actualización automática $(date -u +%F)"
          git push
      - name: Preparar web estática
        run: |
          mkdir -p public
          cp web/*.html public/
          cp app/assets/snapshot.json public/snapshot.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    permissions:
      actions: read # Consultar el artefacto generado por el job validado.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
